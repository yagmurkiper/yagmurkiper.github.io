<header class="site-header d-flex flex-column flex-md-row align-items-center pb-3 mb-5 border-bottom">
  <div>
    <a href="{{ site.github.url }}/" class="site-brand d-flex align-items-center text-decoration-none">
      <span class="site-title fs-4 fw-bold">{{ site.title }}</span>
    </a>
    <a href="{{ site.github.url }}/" class="site-brand d-flex align-items-center text-decoration-none">
      <span class="site-description small">{{ site.description }}</span>
    </a>
  </div>

  <nav class="site-nav d-inline-flex mt-2 mt-md-0 ms-md-auto" aria-label="Main navigation">
    {% for item in site.data.settings.menu %}
      <a 
        class="site-nav-link me-3 py-2 text-decoration-none {% if page.url == item.url %}active{% endif %}" 
        href="{{ site.github.url }}{{ item.url }}">
        {{ item.name }}
      </a>
    {% endfor %}
  </nav>
</header>
