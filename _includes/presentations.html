<div class="row g-5 mb-5">
  <div>
    <h3 class="fw-bold border-bottom pb-3 mb-5">Presentations</h3>
    {% for presentation in site.data.presentations %}
    <div class="row g-5 mb-5">
      <div class="col-md-12">
        <h4>{{ presentation.title }}</h4>
        <p><strong>Presented at:</strong> {{ presentation.event }}</p>
        <p><strong>Date:</strong> {{ presentation.date }}</p>
        <p><strong>Location:</strong> {{ presentation.location }}</p>
        <p>{{ presentation.description }}</p>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
