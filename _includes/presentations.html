<div class="row g-5 mb-5">
  <div class="col-md-12">
    <!-- Title -->
    <h3 class="fw-bold border-bottom pb-3 mb-4 text-primary">Presentations</h3>

    <!-- Scrollable Presentations Container -->
    <div class="presentations-container">
      {% for item in site.data.presentations.index %}
        <div class="presentation-item">
          <p>
            <strong class="text-secondary">{{ item.year }}</strong> - 
            <span>{{ item.title }}</span><br>
            <em>{{ item.event }}</em>, {{ item.location }}<br>
            {% if item.authors %}
              <span>{{ item.authors }}</span><br>
            {% endif %}
            {% if item.links %}
              {% for link in item.links %}
                <a href="{{ link.url }}" target="_blank">{{ link.text }}</a>
              {% endfor %}
            {% endif %}
          </p>
        </div>
      {% endfor %}
    </div>

    <!-- Image Section -->
    <div class="presentations-image text-center mt-4">
      <img src="/assets/img/goldengate.jpg" alt="Presentation Image" class="img-fluid rounded">
    </div>
  </div>
</div>

<style>
  /* Presentations Container Styling */
  .presentations-container {
    max-height: 200px; /* Set maximum height for scrollable area */
    overflow-y: auto; /* Enable vertical scrolling */
    padding: 15px;
    background-color: #f9f9f9; /* Light neutral background */
    border: 1px solid #ddd; /* Subtle border */
    border-radius: 8px; /* Rounded corners */
  }

  /* Individual Presentation Items */
  .presentation-item {
    margin-bottom: 10px; /* Space between items */
    font-size: 0.95rem; /* Compact text */
    line-height: 1.4; /* Comfortable line spacing */
  }

  .presentation-item:last-child {
    margin-bottom: 0; /* Remove space after the last item */
  }

  /* Styling for Dates */
  .text-secondary {
    color: #333; /* Dark text for dates */
    font-weight: bold;
  }

  /* Link Styling */
  a {
    color: #007bff; /* Blue links */
    text-decoration: none;
    font-weight: bold; /* Highlight links */
  }

  a:hover {
    text-decoration: underline;
  }

  /* Image Section Styling */
  .presentations-image {
    margin-top: 20px;
  }

  .img-fluid {
    max-width: 100%; /* Ensure image scales within its container */
    height: auto;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Subtle shadow for image */
  }

  /* Responsive Adjustments */
  @media (max-width: 768px) {
    .presentations-container {
      padding: 10px;
    }

    .presentation-item {
      font-size: 0.9rem;
    }
  }
</style>
