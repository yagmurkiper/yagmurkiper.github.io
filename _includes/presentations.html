<div class="row g-5 mb-5">
  <div class="col-12">
    <!-- Title -->
    <h3 class="fw-bold border-bottom pb-3 mb-4 text-primary">Presentations</h3>

    <!-- Scrollable Presentations Container -->
    <div class="presentations-container">
      {% for item in site.data.presentations.index %}
        <div class="presentation-item">
          <p>
            <strong class="text-secondary">{{ item.year }}</strong> - 
            <span>{{ item.title }}</span>, 
            <em>{{ item.event }}</em>, {{ item.location }}
          </p>
          {% if item.links %}
            <p class="presentation-links">
              {% for link in item.links %}
                <a href="{{ link.url }}" target="_blank"><strong>[{{ link.text }}]</strong></a>
              {% endfor %}
            </p>
          {% endif %}
        </div>
      {% endfor %}
    </div>

    <!-- Photo Section -->
    <div class="photo-container">
      <div class="photo-title">golden gate, san francisco, in dec 2022</div>
      <img src="/assets/img/goldengate.jpg" alt="Presentation Image" class="img-fluid rounded">
    </div>
  </div>
</div>

<style>
  /* Presentations Container Styling */
  .presentations-container {
    max-height: 300px; /* Set maximum height for scrollable area */
    overflow-y: auto; /* Enable vertical scrolling */
    padding: 15px;
    background-color: #f9f9f9; /* Light neutral background */
    border: 1px solid #ddd; /* Subtle border */
    border-radius: 8px; /* Rounded corners */
    width: 100%; /* Ensure it uses the full width */
  }

  /* Individual Presentation Items */
  .presentation-item {
    margin-bottom: 15px; /* Space between items */
    font-size: 0.95rem; /* Compact text */
    line-height: 1.6; /* Comfortable line spacing */
  }

  /* Styling for Dates */
  .text-secondary {
    color: #333; /* Dark text for dates */
    font-weight: bold;
  }

  /* Link Styling */
  .presentation-links {
    margin-top: 5px; /* Space above the links */
  }

  a {
    color: #007bff; /* Blue links */
    text-decoration: none;
    font-weight: bold; /* Highlight links */
    margin-right: 10px; /* Space between links */
  }

  a:hover {
    text-decoration: underline;
  }

  /* Photo Container Styling */
  .photo-container {
    margin-top: 20px;
    border: 1px solid #ddd; /* Match the border style of presentations-container */
    border-radius: 8px; /* Match the rounded corners */
    overflow: hidden; /* Prevent image overflow */
    width: 80%; /* Make the photo container smaller than the presentations box */
    margin-left: auto; /* Center the container */
    margin-right: auto; /* Center the container */
    text-align: center; /* Center content inside */
  }

  .photo-container img {
    width: 100%; /* Make image stretch to match the container's width */
    height: auto; /* Keep the aspect ratio intact */
  }

  /* Photo Title Styling */
  .photo-title {
    font-size: 0.8rem; /* Small font size for the title */
    color: #666; /* Subtle gray color */
    margin-bottom: 10px; /* Spacing between the title and the photo */
    text-align: center; /* Center the title */
    font-style: italic; /* Optional: Make the title italic */
  }

  /* Responsive Adjustments */
  @media (max-width: 768px) {
    .presentations-container {
      padding: 10px;
    }

    .presentation-item {
      font-size: 0.9rem;
    }

    .photo-container {
      width: 90%; /* Adjust width for smaller screens */
    }
  }
</style>
