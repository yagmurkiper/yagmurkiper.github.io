<footer class="pt-5 my-5 border-top">
  <div class="row">
    <div class="col-12 text-center social-media-icons">
      {% for item in site.data.settings.social %}
        <a href="{{ item.link }}" class="footer-link mx-3 fs-5" target="_blank" rel="noopener noreferrer">
          <i class="{{ item.icon }}"></i>
        </a>
      {% endfor %}
    </div>
  </div>
</footer>
