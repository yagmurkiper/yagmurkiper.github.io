      - id: case-of-sluicing
        year: '2020'
        title: In the case of sluicing
        authors: Sebahat Yağmur Kiper
        venue: 'Master of Arts thesis, Middle East Technical University. OpenMETU.'
        abstract: >-
          This thesis investigates case connectivity and anti-connectivity in
          Turkish sluicing-like constructions, drawing on acceptability judgments
          from 216 participants. It documents the distribution of case-marked
          wh-remnants, including restrictions on accusative and subject genitive
          with tense morphology. The analysis combines a movement-and-deletion
          approach to connectivity with a pro-form approach to anti-connectivity.
          It also examines the position of the particle ki in embedded questions
          and its consequences for the size of the sluicing source.
        abstract_note: 'Summary adapted from the thesis abstract in OpenMETU.'
        links:
          - label: PDF
            url: https://open.metu.edu.tr/bitstream/handle/11511/69179/12625825.pdf
          - label: Repository
            url: https://hdl.handle.net/11511/69179
        bibtex: |-
