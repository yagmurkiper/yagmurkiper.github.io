      - year: "2022"
        title: 'The position of the Q-like particle <em>ki</em> in Turkish and consequences for sluicing'
        venue: >-
          In Marianne Huijsmans and Sander Nederveen
          (eds.), <em>Proceedings of the Northwest
          Linguistics Conference 37</em>.
          Vancouver, BC: UBCWPL.

        abstract: >-
          This paper investigates the distribution of
          the Turkish Q-like particle <em>ki</em>.
          It argues that the particle can occur in
          tensed embedded questions, contrary to
          earlier claims. This distribution motivates
          an analysis of embedded sluicing in which
          wh-remnants move to the closest tensed CP.

        abstract_note: >-
          Temporary summary; to be replaced with the
          published abstract.

