      - year: "2026"
        title: Ellipsis as leverage for dependent case theory
        venue: >-
          In <em>Proceedings of the Fifty-Sixth Annual
          Meeting of the North East Linguistic Society</em>.
          GLSA.

        abstract: >-
          This paper uses low sluicing in Turkish to
          investigate the mechanisms of case assignment.
          Accusative and genitive on embedded subjects
          are absent from certain wh-remnants even when
          their correlates bear those cases, while other
          case markers can survive ellipsis. The paper
          argues that these contrasts support a
          configurational approach to structural case
          under dependent case theory rather than an
          exclusively head-driven account.

        abstract_note: >-
