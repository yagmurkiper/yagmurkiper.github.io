      - year: "2020"
        title: In the case of sluicing
        venue: >-
          Master's thesis, Middle East Technical
          University. OpenMETU.

        abstract: >-
          This thesis investigates case connectivity
          and anti-connectivity in Turkish sluicing-like
          constructions. An acceptability judgment
          study with 216 participants tests the
          distribution of case-marked wh-remnants.
          The analysis distinguishes connectivity
          and anti-connectivity and addresses the
          availability of embedded sluicing and the
          distribution of the particle <em>ki</em>.

        abstract_note: >-
          Short working summary based on the thesis
