      # NWLC 37

      - year: "2022"
        title: 'The position of the Q-like particle <em>ki</em> in Turkish and consequences for sluicing'
        venue: >-
          In Marianne Huijsmans and Sander Nederveen
          (eds.), <em>Proceedings of the Northwest
          Linguistics Conference 37</em>.
          Vancouver, BC: UBCWPL.

        abstract: >-
          The paper revises the distribution of the so-called
          Q-like particle <em>ki</em> in Turkish and investigates
          the consequences of this revised distribution for
          embedded sluicing constructions. Contrary to the
          claim that <em>ki</em> appears only in matrix clauses
          (Ince, 2012; Zidani-Eroğlu, 2019), I show that it
          can also occur in embedded interrogative clauses
          when they are tensed. Based on this possibility,
          I propose an analysis of sluicing constructions
          in Turkish, where I argue that wh-remnants in
          embedded sluicing environments raise to the
          [Spec CP] position of the closest tensed clause
          (contra Ince, 2012).

        links:
          - label: PDF
            url: https://lingpapers.sites.olt.ubc.ca/files/2022/01/NWLC37_Kiper_Final.pdf

