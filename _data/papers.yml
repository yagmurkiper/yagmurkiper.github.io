      # NELS 57

      - year: "In prep"
        title: Two distinct mechanisms for genitive across nominalizations in Turkish
        venue: >-
          <em>Proceedings of the Fifty-Seventh Annual
          Meeting of the North East Linguistic Society</em>.
          GLSA.

        links:
          - label: Abstract
            url: https://s3.amazonaws.com/files.commons.gc.cuny.edu/wp-content/blogs.dir/50641/files/2026/10/Kiper.pdf


      # NELS 56

      - year: "2026"
        title: Ellipsis as leverage for dependent case theory
        venue: >-
          In Gabriel Correa and Kevin Morand (eds.),
          <em>Proceedings of the Fifty-Sixth Annual
          Meeting of the North East Linguistic Society</em>.
          Amherst, MA: GLSA, University of Massachusetts Amherst.

        abstract: >-
          This paper uses low sluicing in Turkish as a
          diagnostic for the timing of ellipsis licensing
          and structural case assignment. In low sluicing,
          wh-remnants bear case, auxiliary and tense morphology,
          but structural cases such as accusative and genitive
          fail to survive the ellipsis, even though they are
          present on the correlate in the antecedent clause.
          I argue that this disconnectivity cannot be reduced
          to a copular clause source: low sluicing allows
          multiple wh-remnants and adjunct remnants, and it
          is island-sensitive. Instead, I propose that low
          sluicing has a full clausal source, but that the
          ellipsis-licensing head renders its complement
          inaccessible for later case computation. Under a
          dependent case approach, this prevents wh-remnants
          from entering the configurational relations required
          for accusative or genitive case assignment, causing
          them to surface with unmarked nominative case.
          The analysis shows that ellipsis licensing can affect
          syntactic computation and provides new evidence for
          a configurational theory of structural case.

        links:
          - label: PDF
            url: https://lingbuzz.net/lingbuzz/010106

